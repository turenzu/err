name: Delete Old Workflow Runs
on:
  schedule:
    - cron: '0 0 * * 0' # 每周日午夜运行
  workflow_dispatch: # 支持手动触发

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write # 必需的删除权限
    steps:
      - name: Delete Workflow Runs
        uses: ophub/delete-releases-workflows@v1
        with:
          retain_days: 2
          keep_minimum_runs: 1
